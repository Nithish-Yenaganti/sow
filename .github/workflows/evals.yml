name: Evals

# Real-project accuracy checks. They clone public repos, so they run weekly and on demand,
# not on every pull request.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC

permissions:
  contents: read

jobs:
  compliance:
    name: compliance eval (8 open-source projects)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: evals/compliance/.cache
          key: compliance-eval-${{ hashFiles('evals/compliance/repos.json') }}
      - name: Run eval
        run: uv run --frozen --project skills/compliance/cli python evals/compliance/run.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compliance-eval-results
          path: evals/compliance/RESULTS.md

  guarded:
    name: guarded eval (14 open-source projects)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: evals/guarded/.cache
          key: guarded-eval-${{ hashFiles('evals/guarded/repos.json') }}
      - name: Run eval
        run: uv run --frozen --project skills/guarded/cli python evals/guarded/run.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guarded-eval-results
          path: evals/guarded/RESULTS.md
