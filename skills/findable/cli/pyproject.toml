[project]
# Not published to PyPI: the skill runs this project with `uv run --project`.
name = "findable"
version = "0.6.2"
description = "Can Google and AI engines find, read and cite your site? Scan your codebase and live site, then fix what blocks it."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
  "selectolax>=1.0",
  "protego>=0.3",
  "jinja2>=3.1",
]

[project.scripts]
findable = "findable.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/findable"]

[tool.pytest.ini_options]
testpaths = ["../../../tests/findable"]
