[project]
# Not published to PyPI: the skill runs this project with `uv run --project`.
name = "compliance"
version = "0.1.0"
description = "Find the privacy, licensing, payments and AI compliance gaps in your web project, then build the fixes you agree to."
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "typer>=0.12",
  "jinja2>=3.1",
]

[project.scripts]
compliance = "compliance.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compliance"]

[tool.pytest.ini_options]
testpaths = ["../../../tests/compliance"]
